<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skate Tricks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #fff;
      color: #111;
      font-family: monospace;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #333;
    }

    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex: 1;
      min-height: 0;
    }

    /* ── Trick list ── */
    .trick-list {
      width: 180px;
      flex-shrink: 0;
      height: 100%;
      overflow-y: auto;
    }

    .trick-list button {
      display: block;
      width: 100%;
      background: none;
      border: 1px solid #ddd;
      color: #444;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .trick-list button:hover {
      border-color: #999;
      color: #111;
    }

    .trick-list button.active {
      border-color: #111;
      color: #111;
    }

    /* clip sub-list */
    .clip-list {
      margin-bottom: 8px;
      padding-left: 10px;
      border-left: 1px solid #ddd;
    }

    .clip-list button {
      font-size: 0.75rem;
      color: #aaa;
      border-color: #eee;
      padding: 4px 8px;
    }

    .clip-list button:hover {
      color: #444;
      border-color: #bbb;
    }

    .clip-list button.active {
      color: #111;
      border-color: #888;
    }

    /* ── Player ── */
    .player {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }

    .video-wrap {
      background: #000;
      position: relative;
      flex: 1;
      min-height: 0;
      aspect-ratio: 16 / 9;
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* frame counter overlay */
    .frame-counter {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.75rem;
      color: #eee;
      background: rgba(0,0,0,0.4);
      padding: 2px 6px;
    }

    /* ── Controls ── */
    .controls {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* scrub slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #ddd;
      outline: none;
      cursor: pointer;
      padding: 12px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      background: #111;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      background: #111;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-row button {
      background: none;
      border: 1px solid #ddd;
      color: #444;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 6px 14px;
      cursor: pointer;
    }

    .btn-row button:hover {
      border-color: #999;
      color: #111;
    }

    #btn-play {
      padding: 6px 20px;
      border-color: #999;
      color: #111;
    }

    .time-display {
      margin-left: auto;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* ── Search ── */
    #search {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid #ddd;
      color: #111;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 6px 0;
      margin-bottom: 20px;
      outline: none;
    }

    #search::placeholder { color: #888; }
    #search:focus { border-bottom-color: #999; }

    .trick-entry { display: block; }
    .trick-entry.hidden { display: none; }
  </style>
</head>
<body>

<div style="margin-bottom:24px;">
  <img src="logo.png" style="height:110px; display:block; margin-bottom:6px;">
  <h1>STEEZE REPO</h1>
</div>

<input type="text" id="search" placeholder="search tricks..." autocomplete="off" spellcheck="false">

<div class="layout">

  <!-- trick list -->
  <nav class="trick-list" id="trick-list">
    <!-- populated by JS -->
  </nav>

  <!-- player -->
  <div class="player">
    <div class="video-wrap" id="video-wrap">
      <video id="vid" preload="metadata"></video>
      <span class="frame-counter" id="frame-counter">f 0</span>
    </div>

    <div class="controls">
      <input type="range" id="scrubber" min="0" max="1000" value="0" step="1">

      <div class="btn-row">
        <button id="btn-prev" title="Previous frame">&#9664; frame</button>
        <button id="btn-play" id="btn-play">play</button>
        <button id="btn-next" title="Next frame">frame &#9654;</button>
        <button id="btn-speed">1x</button>
        <button id="btn-mute">mute</button>
        <span class="time-display" id="time-display">0.000 / 0.000</span>
      </div>
      <div id="clip-name" style="font-size:0.75rem; color:#555;"></div>
    </div>
  </div>

</div>

<footer style="margin-top:48px; font-size:0.7rem; color:#555; border-top:1px solid #eee; padding-top:12px;">
  <!-- something for submissions? -->
  All footage belongs to its respective owners. 
  For takedown requests: <a href="mailto:placeholder@example.com" style="color:#555;">placeholder@example.com</a>
</footer>

<script src="tricks.js"></script>
<script>
  const FPS      = 30;
  const FRAME_DUR = 1 / FPS;

  const vid      = document.getElementById("vid");
  vid.muted = true;
  const scrubber = document.getElementById("scrubber");
  const btnPlay  = document.getElementById("btn-play");
  const btnPrev  = document.getElementById("btn-prev");
  const btnNext  = document.getElementById("btn-next");
  const timeDisp  = document.getElementById("time-display");
  const frameCtr  = document.getElementById("frame-counter");
  const listEl    = document.getElementById("trick-list");
  const clipName  = document.getElementById("clip-name");
  const searchEl  = document.getElementById("search");

  let activeTrickBtn = null;
  let activeClipBtn  = null;

  // subsequence fuzzy match: does every char of q appear in order in s?
  function fuzzy(q, s) {
    s = s.toLowerCase();
    q = q.toLowerCase();
    let si = 0;
    for (let qi = 0; qi < q.length; qi++) {
      si = s.indexOf(q[qi], si);
      if (si === -1) return false;
      si++;
    }
    return true;
  }

  function matchesTrick(trick, q) {
    if (!q) return true;
    const terms = [trick.label, ...(trick.aliases || [])];
    return terms.some(t => fuzzy(q, t));
  }

  // Each trick entry = { trickBtn, clipList, trick }
  const trickEntries = [];

  // Build trick + clip list
  tricks.forEach((trick, i) => {
    const trickBtn = document.createElement("button");
    trickBtn.textContent = trick.label;

    const clipList = document.createElement("div");
    clipList.className = "clip-list";
    clipList.style.display = "none";

    trick.clips.forEach((src, j) => {
      const clipBtn = document.createElement("button");
      clipBtn.textContent = src.split("/").pop();
      clipBtn.addEventListener("click", () => loadClip(src, clipBtn));
      clipList.appendChild(clipBtn);
    });

    trickBtn.addEventListener("click", () => {
      // Toggle clip list visibility
      const isOpen = clipList.style.display !== "none";
      clipList.style.display = isOpen ? "none" : "block";

      if (activeTrickBtn) activeTrickBtn.classList.remove("active");
      activeTrickBtn = trickBtn;
      trickBtn.classList.add("active");

      // Auto-load first clip when opening
      if (!isOpen && trick.clips.length > 0) {
        loadClip(trick.clips[0], clipList.querySelector("button"));
      }
    });

    listEl.appendChild(trickBtn);
    listEl.appendChild(clipList);
    trickEntries.push({ trickBtn, clipList, trick });

    // Select first trick and clip on load
    if (i === 0) {
      trickBtn.click();
    }
  });

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim();
    trickEntries.forEach(({ trickBtn, clipList, trick }) => {
      const match = matchesTrick(trick, q);
      trickBtn.style.display = match ? "block" : "none";
      if (!match) clipList.style.display = "none";
    });
  });

  function loadClip(src, btn) {
    if (activeClipBtn) activeClipBtn.classList.remove("active");
    activeClipBtn = btn;
    btn.classList.add("active");

    vid.src = src;
    vid.load();
    vid.pause();
    btnPlay.textContent = "play";
    scrubber.value = 0;
    clipName.textContent = src.split("/").pop();
  }

  // Scrubber sync
  vid.addEventListener("timeupdate", syncUI);
  vid.addEventListener("loadedmetadata", () => {
    const totalFrames = Math.round((vid.duration || 0) * FPS);
    scrubber.min  = 0;
    scrubber.max  = totalFrames;
    scrubber.step = 1;
    syncUI();
  });
  vid.addEventListener("ended", () => {
    if (btnPlay.textContent === "pause") {
      vid.currentTime = 0;
      vid.play();
    } else {
      btnPlay.textContent = "play";
    }
  });

  function syncUI() {
    const t     = vid.currentTime;
    const frame = Math.round(t * FPS);
    scrubber.value = frame;
    timeDisp.textContent = `${t.toFixed(3)} / ${(vid.duration || 0).toFixed(3)}`;
    frameCtr.textContent = `f ${frame}`;
  }

  scrubber.addEventListener("input", () => {
    vid.currentTime = parseInt(scrubber.value) / FPS;
  });

  btnPlay.addEventListener("click", () => {
    if (vid.paused) { vid.play();  btnPlay.textContent = "pause"; }
    else            { vid.pause(); btnPlay.textContent = "play";  }
  });

  btnPrev.addEventListener("click", () => {
    vid.pause();
    btnPlay.textContent = "play";
    vid.currentTime = Math.max(0, vid.currentTime - FRAME_DUR);
  });

  btnNext.addEventListener("click", () => {
    vid.pause();
    btnPlay.textContent = "play";
    vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + FRAME_DUR);
  });

  const btnSpeed = document.getElementById("btn-speed");
  let slowMode = false;

  btnSpeed.addEventListener("click", () => {
    slowMode = !slowMode;
    vid.playbackRate = slowMode ? 0.5 : 1;
    btnSpeed.textContent = slowMode ? "0.5x" : "1x";
    btnSpeed.style.borderColor = slowMode ? "#999" : "#ddd";
    btnSpeed.style.color = slowMode ? "#111" : "#444";
  });

  const btnMute = document.getElementById("btn-mute");

  function getMuteCookie() {
    return document.cookie.split(";").some(c => c.trim() === "muted=1");
  }

  function setMuteCookie(muted) {
    const exp = new Date();
    exp.setFullYear(exp.getFullYear() + 1);
    document.cookie = `muted=${muted ? 1 : 0}; expires=${exp.toUTCString()}; path=/`;
  }

  function applyMute(muted) {
    vid.muted = muted;
    btnMute.textContent = muted ? "unmute" : "mute";
    btnMute.style.borderColor = muted ? "#999" : "#ddd";
    btnMute.style.color = muted ? "#111" : "#444";
  }

  applyMute(getMuteCookie());

  btnMute.addEventListener("click", () => {
    const muted = !vid.muted;
    applyMute(muted);
    setMuteCookie(muted);
  });

  document.getElementById("video-wrap").addEventListener("click", () => {
    btnPlay.click();
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space")      { e.preventDefault(); btnPlay.click(); }
    if (e.code === "ArrowLeft"  || e.key === ",") { e.preventDefault(); btnPrev.click(); }
    if (e.code === "ArrowRight" || e.key === ".") { e.preventDefault(); btnNext.click(); }
  });
</script>

</body>
</html>
