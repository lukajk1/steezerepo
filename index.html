<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steeze Repo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #000;
      font-family: monospace;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    header img { height: 48px; display: block; }

    h1 {
      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #000;
    }

    #search {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid #ddd;
      color: #000;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 6px 0;
      outline: none;
    }

    #search::placeholder { color: #000; }
    #search:focus { border-bottom-color: #999; }

    .trick-list a {
      display: block;
      width: 100%;
      border: 1px solid #ddd;
      color: #000;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 10px 12px;
      text-decoration: none;
      margin-bottom: 4px;
    }

    .trick-list a:hover {
      border-color: #999;
      color: #000;
    }

    footer {
      font-size: 0.7rem;
      color: #000;
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 8px;
    }

    footer a { color: #000; }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="logo">
  <h1>STEEZE_REPO</h1>
</header>

<input type="text" id="search" placeholder="search tricks..." autocomplete="off" spellcheck="false">

<nav class="trick-list" id="trick-list"></nav>

<footer>
  All footage belongs to its respective owners.
  For takedown requests: <a href="mailto:placeholder@example.com">placeholder@example.com</a>
</footer>

<script src="tricks.js"></script>
<script>
  const listEl  = document.getElementById("trick-list");
  const searchEl = document.getElementById("search");

  function fuzzy(q, s) {
    s = s.toLowerCase(); q = q.toLowerCase();
    let si = 0;
    for (let qi = 0; qi < q.length; qi++) {
      si = s.indexOf(q[qi], si);
      if (si === -1) return false;
      si++;
    }
    return true;
  }

  function matchesTrick(trick, q) {
    if (!q) return true;
    return [trick.label, ...(trick.aliases || [])].some(t => fuzzy(q, t));
  }

  const entries = tricks.map(trick => {
    const a = document.createElement("a");
    a.textContent = trick.label;
    a.href = `viewer.html?trick=${encodeURIComponent(trick.label)}`;
    listEl.appendChild(a);
    return { a, trick };
  });

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim();
    entries.forEach(({ a, trick }) => {
      a.style.display = matchesTrick(trick, q) ? "block" : "none";
    });
  });
</script>

</body>
</html>
