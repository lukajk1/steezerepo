<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steeze Repo — Skate Trick Reference</title>
  <meta name="description" content="A frame-by-frame skate trick reference tool. Browse flatground tricks and more from the most stylish skaters.">
  <meta name="keywords" content="skateboarding, skate tricks, kickflip, heelflip, frame by frame, skate reference, slow motion, slomo">
  <meta name="robots" content="index, follow">
  <meta property="og:url" content="https://steezerepo.vercel.app">
  <meta property="og:title" content="Steeze Repo">
  <meta property="og:description" content="Frame-by-frame skate trick reference.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://steezerepo.vercel.app/assets/logo.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #000;
      font-family: monospace;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    header img { height: 108px; display: block; }

    h1 {
      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #000;
    }

    #search {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid #ddd;
      color: #000;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 6px 0;
      outline: none;
    }

    #search::placeholder { color: #000; }
    #search:focus { border-bottom-color: #999; }

    .trick-list a {
      display: block;
      width: 100%;
      border: 1px solid #ddd;
      color: #000;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 10px 12px;
      text-decoration: none;
      margin-bottom: 4px;
    }

    .trick-list a:hover {
      border-color: #999;
      color: #000;
    }

    .trick-list a.child {
      margin-left: 24px;
      width: calc(100% - 24px);
    }

    footer {
      font-size: 0.7rem;
      color: #000;
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 8px;
    }

    footer a { color: #000; }
  </style>
</head>
<body>

<header>
  <img src="assets/logo.png" alt="logo">
  <h1>Steeze Repo</h1>
</header>

<input type="text" id="search" placeholder="search tricks..." autocomplete="off" spellcheck="false">

<nav class="trick-list" id="trick-list"></nav>

<footer>
  All footage belongs to its respective owners.
  For takedown requests: <a href="mailto:steezerepo@gmail.com">steezerepo@gmail.com</a>
</footer>

<script src="js/tricks.js"></script>
<script>
  const listEl  = document.getElementById("trick-list");
  const searchEl = document.getElementById("search");

  function fuzzy(q, s) {
    s = s.toLowerCase(); q = q.toLowerCase();
    let si = 0;
    for (let qi = 0; qi < q.length; qi++) {
      si = s.indexOf(q[qi], si);
      if (si === -1) return false;
      si++;
    }
    return true;
  }

  function matchesTrick(trick, q) {
    if (!q) return true;
    return [trick.label, ...(trick.aliases || [])].some(t => fuzzy(q, t));
  }

  // Render parents first, with their children immediately after
  const ordered = [];
  const parents = tricks.filter(t => !t.parent);
  parents.forEach(parent => {
    ordered.push(parent);
    tricks.filter(t => t.parent === parent.label).forEach(child => ordered.push(child));
  });
  // Any remaining (children whose parent isn't in the list)
  tricks.forEach(t => { if (!ordered.includes(t)) ordered.push(t); });

  const entries = ordered.map(trick => {
    const a = document.createElement("a");
    a.textContent = `${trick.label} — ${trick.clips.length}`;
    a.href = `viewer.html?trick=${encodeURIComponent(trick.label)}`;
    if (trick.parent) a.classList.add("child");
    listEl.appendChild(a);
    return { a, trick };
  });

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim();

    // First pass: determine which tricks match
    const matched = new Set();
    entries.forEach(({ trick }) => {
      if (matchesTrick(trick, q)) matched.add(trick.label);
    });

    // If a child matches, also show its parent
    entries.forEach(({ trick }) => {
      if (trick.parent && matched.has(trick.label)) matched.add(trick.parent);
    });

    entries.forEach(({ a, trick }) => {
      a.style.display = matched.has(trick.label) ? "block" : "none";
    });
  });
</script>

</body>
</html>
